name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python tests/run_all_tests.py
      - name: CLI smoke test
        run: |
          python main.py --cli --op multiply --numeral binary --a 6 --b 7 | tail -1 | grep -x "Result (binary -> int): 42"
          python main.py --table --op add --numeral unary > /dev/null
